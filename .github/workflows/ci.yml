```yaml
name: CI

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Build and Test AIChat
      run: |
        xcodebuild -scheme AIChat clean build test
```
Файл для GitHub Actions (ci.yml) был создан для вашего проекта AIChat. В этом файле настроена сборка и тестирование проекта при каждом push в репозиторий. Решение адаптировано под структуру и особенности вашего проекта.