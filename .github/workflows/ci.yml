name: CI
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Set up Xcode
        uses: actions/setup-xcode@v2
        with:
          xcode-version: '13.0'
      - name: Build
        run: xcodebuild build -scheme AIChat
      - name: Test
        run: xcodebuild test -scheme AIChat
```